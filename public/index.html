<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <img src="/assets/images/dynamiteSushiLogoWhite.svg" alt="dynamite sushi logo">
    </header>

    <section id="specialsSection">
        <h1>SPECIALS</h1>

        <article id="bentoSpecial">
            <h2>BENTO</h2>
        </article>

        <article id="weeklySpecial">
            <h2>WEEKLY</h2>
        </article>

        <article id="saleSpecial">
            <h2>SALES</h2>
        </article>
    </section>
    
    <section id="menuSection">
        <h1>MENU</h1>
        
        <nav id="filterArea">
            <ul>
                <li id="spicy" class="circle"></li>
                <li id="vegan" class="circle"></li>
                <li id="sale" class="circle"></li>
                <li id="chefsChoice" class="circle"></li>
            </ul>
        </nav>
        
        <article id="starters" class="mainCategory">
            <article class="subCategory" data-subcategory="salad"></article>
            <article class="subCategory" data-subcategory="appetizers"></article>
            <article class="subCategory" data-subcategory="yubu"></article>
        </article>

        <article id="kitchenEntrees" class="mainCategory">
            <article class="subCategory" data-subcategory="hotFoods"></article>
        </article>

        <article id="sushiFusion" class="mainCategory">
            <article class="subCategory" data-subcategory="sushiPizza"></article>
            <article class="subCategory" data-subcategory="sushiBurrito"></article>
        </article>

        <article id="riceBowls" class="mainCategory">
            <article class="subCategory" data-subcategory="poke"></article>
            <article class="subCategory" data-subcategory="donburi"></article>
        </article>

        <article id="makiRolls" class="mainCategory">
            <article class="subCategory" data-subcategory="classicRolls"></article>
            <article class="subCategory" data-subcategory="veganRolls"></article>
            <article class="subCategory" data-subcategory="deepFriedRolls"></article>
        </article>

        <article id="signatureDragons" class="mainCategory">
            <article class="subCategory" data-subcategory="veganDragon"></article>
            <article class="subCategory" data-subcategory="premiumDragon"></article>
            <article class="subCategory" data-subcategory="aburiDragon"></article>
        </article>

        <article id="aLaCarte" class="mainCategory">
            <article class="subCategory" data-subcategory="sushi"></article>
            <article class="subCategory" data-subcategory="sashimi"></article>
        </article>

        <article id="combosAndTrays" class="mainCategory">
            <article class="subCategory" data-subcategory="sushiCombo"></article>
            <article class="subCategory" data-subcategory="partyTray"></article> 
        </article>

        <article id="beverages" class="mainCategory">
            <article class="subCategory" data-subcategory="drinks"></article>
            <article class="subCategory" data-subcategory="alcohol"></article>
        </article>
    </section>

    <footer>
        <a href="https://tinyurl.com/472fcvhs" target="_blank">1661 Bloor St W, Toronto, ON</a>
        <a href="tel: +16473688122" class="mobileOnly">(647) 368-8122</a>
    </footer>
    
    <script src="/assets/js/main.js"></script>
</body>
</html>
